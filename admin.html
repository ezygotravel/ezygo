<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EzyGo Admin</title><link rel="icon" href="/favicon.ico" sizes="any">\n<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">\n<link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png">\n<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">\n<style>
:root{--bg:#f6f7f8;--card:#fff;--line:#e7e9ec;--text:#17181a;--muted:#7a7e84}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}.wrap{width:min(1180px,calc(100% - 28px));margin:28px auto 80px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.top h1{font-size:24px;margin:0}.muted{color:var(--muted);font-size:12px}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;white-space:nowrap}.tab.active{background:#111;color:#fff;border-color:#111}.panel{display:none}.panel.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.field{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 13px;background:#fff}.field:focus{outline:2px solid #1111;border-color:#bbb}textarea.field{min-height:96px;resize:vertical}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:12px;padding:10px 13px;background:#111;color:#fff}.ghost{background:#fff;color:#111;border:1px solid var(--line)}.danger{background:#fff;color:#b42424;border:1px solid #efd1d1}.list{display:grid;gap:10px}.item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:10px}.item img{width:64px;height:64px;border-radius:12px;object-fit:cover;background:#eef0f2}.item h3{font-size:14px;margin:0 0 4px}.item p{font-size:11px;color:var(--muted);margin:2px 0}.mini{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.mini button{padding:7px 9px;font-size:11px}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.loginBox{width:min(390px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:24px}.loginBox h1{margin:0 0 8px}.loginBox p{color:var(--muted);font-size:13px;line-height:1.6}.loginBox .field{margin:12px 0}.status{font-size:12px;color:var(--muted);margin-top:8px}.feedback{border:1px solid var(--line);border-radius:16px;padding:14px}.feedback strong{display:block}.feedback small{color:var(--muted)}.feedback p{white-space:pre-wrap;line-height:1.55}.orderItem{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:11px 12px}.badge{font-size:10px;border:1px solid var(--line);padding:4px 7px;border-radius:999px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{grid-template-columns:52px 1fr}.item img{width:52px;height:52px}.mini{grid-column:1/-1;justify-content:flex-start}.wrap{margin-top:16px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body>
<section class="login" id="loginView"><div class="loginBox"><h1>EzyGo Admin</h1><p>Enter your Admin Login ID to continue.</p><input class="field" id="loginId" autocomplete="off" placeholder="Admin Login ID"><button class="btn" id="loginBtn" style="width:100%">Continue</button><div class="status" id="loginStatus"></div></div></section>
<main class="wrap" id="adminView" hidden><div class="top"><div><h1>EzyGo Admin</h1><div class="muted">Supabase connected content manager</div></div><button class="btn ghost" id="logoutBtn">Log out</button></div>
<nav class="tabs"><button class="tab active" data-tab="visas">Visa cards</button><button class="tab" data-tab="packages">Packages</button><button class="tab" data-tab="gallery">Gallery</button><button class="tab" data-tab="groups">Visa sections</button><button class="tab" data-tab="feedback">Feedback</button></nav>
<section class="panel active" id="visas"><div class="card"><h2 id="visaFormTitle">Add visa card</h2><div class="grid"><input id="vCountry" class="field" placeholder="Country"><input id="vFlag" class="field" placeholder="Flag emoji"><select id="vGroup" class="field"></select><input id="vType" class="field" placeholder="Type"><input id="vValidity" class="field" placeholder="Validity / Check details"><input id="vFee" class="field" placeholder="Fee"><input id="vDateLabel" class="field" placeholder="Date label"><input id="vDeadline" class="field" placeholder="Deadline / processing text"><textarea id="vDesc" class="field full" placeholder="Description"></textarea><textarea id="vDocs" class="field full" placeholder="Documents - one per line"></textarea><label class="full muted">Cover image<input id="vCover" type="file" accept="image/*" class="field"></label><label class="full muted">Detail images<input id="vDetails" type="file" accept="image/*" multiple class="field"></label></div><div class="row" style="margin-top:12px"><button class="btn" id="saveVisa">Save visa</button><button class="btn ghost" id="clearVisa">Clear</button></div></div><div class="card"><h2>Visa cards</h2><div class="list" id="visaList"></div></div></section>
<section class="panel" id="packages"><div class="card"><h2 id="packageFormTitle">Add package</h2><div class="grid"><input id="pTitle" class="field" placeholder="Package title"><input id="pTag" class="field" placeholder="Tag"><input id="pDestination" class="field" placeholder="Destination"><input id="pDuration" class="field" placeholder="Duration"><input id="pPrice" class="field" placeholder="Price"><textarea id="pSummary" class="field full" placeholder="Summary"></textarea><textarea id="pHighlights" class="field full" placeholder="Highlights - one per line"></textarea><textarea id="pItinerary" class="field full" placeholder="Itinerary: Day title | description | meal"></textarea><textarea id="pInclusions" class="field full" placeholder="Inclusions - one per line"></textarea><textarea id="pExclusions" class="field full" placeholder="Exclusions - one per line"></textarea><textarea id="pTerms" class="field full" placeholder="Terms - one per line"></textarea><label class="full muted">Cover image<input id="pCover" type="file" accept="image/*" class="field"></label><label class="full muted">Gallery images<input id="pImages" type="file" accept="image/*" multiple class="field"></label></div><div class="row" style="margin-top:12px"><button class="btn" id="savePackage">Save package</button><button class="btn ghost" id="clearPackage">Clear</button></div></div><div class="card"><h2>Packages</h2><div class="list" id="packageList"></div></div></section>
<section class="panel" id="gallery"><div class="card"><h2 id="galleryFormTitle">Add gallery</h2><div class="grid"><input id="gTitle" class="field" placeholder="Gallery title"><textarea id="gDesc" class="field" placeholder="Description"></textarea><label class="full muted">Cover image<input id="gCover" type="file" accept="image/*" class="field"></label><label class="full muted">Gallery images<input id="gImages" type="file" accept="image/*" multiple class="field"></label></div><div class="row" style="margin-top:12px"><button class="btn" id="saveGallery">Save gallery</button><button class="btn ghost" id="clearGallery">Clear</button></div></div><div class="card"><h2>Gallery</h2><div class="list" id="galleryList"></div></div></section>
<section class="panel" id="groups"><div class="card"><h2>Visa sections</h2><div class="row"><input id="newGroup" class="field" style="flex:1" placeholder="New section name"><button class="btn" id="addGroup">Add section</button></div><div class="list" id="groupList" style="margin-top:14px"></div></div></section>
<section class="panel" id="feedback"><div class="card"><h2>Customer feedback</h2><div class="list" id="feedbackList"></div></div></section>
</main><script src="config.js"></script><script src="admin.js"></script></body></html>
